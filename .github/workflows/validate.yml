name: Validate PWA Hub

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check sw.js

      - name: Validate JSON and release integrity
        run: |
          node - <<'NODE'
          const fs = require('fs');

          const read = (file) => fs.readFileSync(file,'utf8');
          const json = (file) => JSON.parse(read(file));

          for (const file of ['links.json','manifest.json','config.json','changelog.json']) {
            json(file);
            console.log(file + ' valid');
          }

          const index = read('index.html');
          const app = read('app.js');
          const sw = read('sw.js');
          const manifest = json('manifest.json');
          const config = json('config.json');
          const changelog = json('changelog.json');
          const version = config.version;

          if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid config version');
          if (!app.includes(`HUB_VERSION = '${version}'`)) throw new Error('app.js version mismatch');
          if (!sw.includes(`VERSION = '${version}'`)) throw new Error('sw.js version mismatch');
          if (!index.includes(`<span>v${version}</span>`)) throw new Error('Footer version mismatch');
          if (changelog[0]?.version !== version) throw new Error('Latest changelog version mismatch');

          if (!index.includes('href="style.css"')) throw new Error('style.css is not linked');
          if (!index.includes('src="app.js"')) throw new Error('app.js is not linked');
          if (index.includes('v13.css') || index.includes('app-v13.js')) throw new Error('Legacy v13 assets still referenced');
          if (fs.existsSync('v13.css') || fs.existsSync('app-v13.js')) throw new Error('Legacy v13 split files still exist');

          for (const token of ["connect-src 'self'","worker-src 'self'","object-src 'none'"]) {
            if (!index.includes(token)) throw new Error('Missing CSP directive: ' + token);
          }

          for (const asset of ['style.css','app.js','manifest.json','icon-192.png','apple-touch-icon.png']) {
            if (!fs.existsSync(asset)) throw new Error('Missing required asset: ' + asset);
          }

          if (!sw.includes("'./style.css'") || !sw.includes("'./app.js'")) {
            throw new Error('Service Worker critical shell is incomplete');
          }

          const themeMatch = index.match(/name="theme-color" content="([^"]+)"/);
          if (!themeMatch) throw new Error('Missing theme-color meta');
          if (manifest.theme_color !== themeMatch[1]) throw new Error('Manifest theme_color mismatch');
          if (manifest.background_color !== themeMatch[1]) throw new Error('Manifest background_color mismatch');

          if (!/^#[0-9a-f]{6}$/i.test(config.accent)) throw new Error('Invalid accent color');
          if (!/^#[0-9a-f]{6}$/i.test(config.accentSecondary)) throw new Error('Invalid secondary accent color');

          const hubUrl = new URL(config.hubUrl);
          if (hubUrl.protocol !== 'https:') throw new Error('Hub URL must use HTTPS');

          if (!fs.existsSync(config.qrImage || 'qr-hub.svg')) throw new Error('Missing QR image');

          if (config.analyticsEndpoint) {
            const endpoint = new URL(config.analyticsEndpoint);
            if (endpoint.protocol !== 'https:') throw new Error('Analytics endpoint must use HTTPS');
            if (endpoint.origin !== hubUrl.origin) throw new Error('Analytics endpoint must be same-origin under the current CSP');
          }

          console.log('Release integrity validated for v' + version);
          NODE

      - name: Validate Hub data model
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const links = JSON.parse(fs.readFileSync('links.json','utf8'));
          const validStatuses = new Set(['live','beta','coming-soon','maintenance']);
          const validThemes = new Set(['blue','green','orange','pink']);
          const validOpen = new Set(['new','same']);

          if (!Array.isArray(links) || !links.length) {
            throw new Error('links.json must contain at least one app');
          }

          const orders = new Set();

          for (const app of links) {
            if (!app || typeof app !== 'object') throw new Error('Each app must be an object');
            if (!app.title || !app.description) throw new Error('Each app needs title and description');
            if (!validStatuses.has(app.status)) throw new Error('Invalid status for ' + app.title);
            if (!validThemes.has(app.theme)) throw new Error('Invalid theme for ' + app.title);
            if (!validOpen.has(app.open || 'new')) throw new Error('Invalid open mode for ' + app.title);
            if (!Number.isInteger(app.order) || app.order < 1) throw new Error('Invalid order for ' + app.title);
            if (orders.has(app.order)) throw new Error('Duplicate order: ' + app.order);
            orders.add(app.order);

            if (app.status !== 'coming-soon') {
              const url = new URL(app.url);
              if (url.protocol !== 'https:') throw new Error('Non-HTTPS URL: ' + app.url);
            }

            if (app.logo) {
              if (/^https?:/i.test(app.logo)) throw new Error('App logos must be local: ' + app.logo);
              if (!fs.existsSync(app.logo)) throw new Error('Missing logo: ' + app.logo);
            }

            if (app.version && !/^\d+\.\d+\.\d+(?:[-+][0-9A-Za-z.-]+)?$/.test(app.version)) {
              throw new Error('Invalid app version for ' + app.title);
            }

            if (app.updated) {
              if (!/^\d{4}-\d{2}-\d{2}$/.test(app.updated) || Number.isNaN(Date.parse(app.updated + 'T12:00:00Z'))) {
                throw new Error('Invalid updated date for ' + app.title);
              }
            }
          }

          console.log('Validated ' + links.length + ' apps');
          NODE
