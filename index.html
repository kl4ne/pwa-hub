<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://ui-avatars.com; manifest-src 'self'; base-uri 'self'; form-action 'self';">

  <title>@rmacfie • PWA Hub</title>
  <meta name="description" content="Roberto S. Macfie's personal hub for PWAs and digital tools.">
  <meta name="color-scheme" content="dark">
  <meta name="application-name" content="PWA Hub">
  <meta name="referrer" content="no-referrer">

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#07111f">

  <!-- iOS PWA settings -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PWA Hub">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="canonical" href="https://kl4ne.github.io/pwa-hub/">
  <link rel="stylesheet" href="style.css">

  <!-- Open Graph / Social previews -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="@rmacfie • PWA Hub">
  <meta property="og:description" content="Personal launchpad for PWAs and digital tools.">
  <meta property="og:url" content="https://kl4ne.github.io/pwa-hub/">
  <meta property="og:image" content="https://kl4ne.github.io/pwa-hub/icon-192.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter/X previews -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="@rmacfie • PWA Hub">
  <meta name="twitter:description" content="Progressive Web Apps portal by Roberto S. Macfie">
  <meta name="twitter:image" content="https://kl4ne.github.io/pwa-hub/icon-192.png">
</head>


<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="grid-overlay" aria-hidden="true"></div>

  <main class="shell">
    <section class="hero glass">
      <div class="hero-bar">
        <span class="chip chip-accent">Personal PWA Hub</span>
        <span class="chip" id="connection-state">Online</span>
      </div>

      <div class="identity identity-centered">
        <div class="avatar-ring">
          <img src="avatar.jpg" class="avatar" alt="Roberto S. Macfie" width="104" height="104" fetchpriority="high">
        </div>
        <div class="identity-copy">
          <h1>@rmacfie <span>• PWA Hub</span></h1>
          <p class="intro intro-centered">Progressive Web Apps • Ready to launch</p>
        </div>
      </div>

      <div class="actions actions-centered" aria-label="Quick actions">
        <button type="button" class="btn btn-primary" id="install-button" hidden><span aria-hidden="true">↓</span><span>Install Hub</span></button>
        <button type="button" class="btn" id="share-button"><span aria-hidden="true">↗</span><span>Share</span></button>
        <button type="button" class="btn" id="copy-button"><span aria-hidden="true">⧉</span><span>Copy Link</span></button>
      </div>
    </section>

    <section class="collection glass" aria-labelledby="collection-title">
      <div class="section-head">
        <div>
          <p class="eyebrow">Launch Collection</p>
          <h2 id="collection-title">My Current Apps</h2>
        </div>
        <span class="section-note">Tap a card to open</span>
      </div>
      <div id="links-container" class="app-grid" aria-live="polite"></div>
    </section>

    <footer class="footer">
      <div class="footer-pills"><span>v1.2.0</span><span>Installable</span><span>Responsive</span></div>
      <p>Designed &amp; Developed by <strong>Roberto S. Macfie</strong></p>
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
