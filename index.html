<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https://ui-avatars.com; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';">
  <title>@rmacfie • PWA Hub</title>
  <meta name="description" content="Roberto S. Macfie's personal hub for Progressive Web Apps and digital tools.">
  <meta name="color-scheme" content="dark">
  <meta name="application-name" content="PWA Hub">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0b141f">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="canonical" href="https://kl4ne.github.io/pwa-hub/">
  <link rel="stylesheet" href="style.css">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PWA Hub">

  <meta property="og:type" content="website">
  <meta property="og:title" content="@rmacfie • PWA Hub">
  <meta property="og:description" content="My Progressive Web Apps • Ready to Use">
  <meta property="og:url" content="https://kl4ne.github.io/pwa-hub/">
  <meta property="og:image" content="https://kl4ne.github.io/pwa-hub/icon-192.png">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="@rmacfie • PWA Hub">
  <meta name="twitter:description" content="My Progressive Web Apps • Ready to Use">
  <meta name="twitter:image" content="https://kl4ne.github.io/pwa-hub/icon-192.png">
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>

  <main class="hub-shell">
    <header class="profile">
      <div class="avatar-ring">
        <img src="avatar.jpg" class="avatar" alt="Roberto S. Macfie" width="96" height="96" fetchpriority="high">
      </div>

      <h1>@rmacfie <span>• PWA Hub</span></h1>
      <p class="tagline">My Progressive Web Apps • Ready to Use</p>

      <div class="quick-actions" aria-label="Quick actions">
        <button type="button" class="quick-btn quick-btn-primary" id="install-button">
          <span aria-hidden="true">↓</span><span>Install</span>
        </button>
        <button type="button" class="quick-btn" id="share-button">
          <span aria-hidden="true">↗</span><span>Share</span>
        </button>
        <button type="button" class="quick-btn" id="copy-button">
          <span aria-hidden="true">⧉</span><span>Copy</span>
        </button>
        <button type="button" class="quick-btn" id="qr-button">
          <span aria-hidden="true">▦</span><span>QR</span>
        </button>
      </div>
      <p class="offline-note" id="offline-note" aria-live="polite" hidden>Offline mode • cached apps available</p>
    </header>

    <section class="apps-section" aria-label="My Progressive Web Apps">
      <div id="links-container" class="app-list" aria-live="polite"></div>
    </section>

    <footer class="hub-footer">
      <div class="footer-tools" aria-label="Hub information">
        <span>v1.3.1</span>
        <button type="button" id="changelog-button">Changelog</button>
        <button type="button" id="about-button">About</button>
      </div>
      <p>Designed &amp; Developed by <strong>Roberto S. Macfie</strong></p>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
